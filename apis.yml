aid: enduranceenergy
name: Endurance Energy
description: >-
  Endurance Energy is a renewable-energy developer building subsea geothermal
  power systems that harness volcanic activity beneath the seafloor to generate
  continuous, weather-independent electricity. Its first product, Adelie, is a
  planned 100 kW subsea power system slated for deployment in September 2026 at
  the Axial Seamount caldera off the Oregon coast, targeting island nations,
  industrial facilities, and data centers that need firm baseload power. The
  company is venture-backed (a Series A led by Founders Fund) and surfaced in the
  API Evangelist network as a Felicis portfolio company. As of this profile it
  publishes no public developer surface, API, SDK, or documentation; this entry
  captures the company identity and probed domain-security posture.
